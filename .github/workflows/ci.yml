name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit & content-integrity tests
        run: npm test
      - name: Generated files are up to date (service worker, headers, sitemap)
        run: npm run check
